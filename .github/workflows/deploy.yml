name: Deploy Hexo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Avoid concurrent deploys; keep the latest queue.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write   # push to gh-pages branch
  pages: write      # bind deploy to Pages
  id-token: write   # OIDC for peaceiris GHA token

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate static files
        run: npx hexo generate

      - name: Bump cache-bust on hero video URL
        run: |
          # Bump "?v=N" so browsers that cached the old video get the new one.
          if [ -f public/video/hero.mp4 ]; then
            OLD=$(grep -oE '/video/hero\.mp4\?v=[0-9]+' source/_includes/cinema-shell.ejs | head -1 \
                  | grep -oE '[0-9]+' || echo "")
            NEW=$((OLD + 1))
            find public -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' \) -print0 \
              | xargs -0 sed -i -E "s#/video/hero\\.mp4(\\?v=${OLD})?#/video/hero.mp4?v=${NEW}#g"
            echo "Cache-bust: ${OLD:-none} -> ${NEW}"
          fi

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          keep_files: false
          force_orphan: true
          enable_jekyll: false
